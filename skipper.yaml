registry: quay.io
build-container-image: assisted-swarm-build
build-container-net: host

volumes:
  # cache
  - $HOME/.cache/go-build:/go/pkg/mod
  # Registry credentials
  - $HOME/.docker/:$HOME/.docker

containers:
  assisted-swarm-build: Dockerfile.assisted-swarm-build
env:
  GOCACHE: "/go/pkg/mod"
